version: '3.8'

services:
  mongodb:
    image: mongo:7.0-alpine
    container_name: casio_calculator_db
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: casio_calculator
    volumes:
      - mongo_data:/data/db
    networks:
      - calculator_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: casio_calculator_server
    ports:
      - '5000:5000'
    environment:
      MONGO_URI: mongodb://mongodb:27017/casio_calculator
      NODE_ENV: development
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - calculator_network
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: casio_calculator_client
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE: http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - calculator_network
    command: npm run dev

volumes:
  mongo_data:

networks:
  calculator_network:
    driver: bridge
